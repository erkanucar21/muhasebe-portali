name: Kontrol ve derleme

# Her gönderimde kodu derler ve hata arar. Kırmızı çıkarsa Actions sekmesinden günlüğü açıp bana gönderin.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Supabase ayar dosyası
        run: |
          cat > lib/ayarlar.dart <<'EOF'
          const supabaseUrl = '${{ vars.SUPABASE_URL }}';
          const supabaseAnonKey = '${{ vars.SUPABASE_ANON_KEY }}';
          EOF

      - name: Paketler
        run: flutter pub get

      - name: Hata taraması (yalnızca hatalar başarısızlık sayılır)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Web derlemesi
        run: flutter build web --release

      - name: Derlemeyi sakla (indirip Netlify'a elle yükleyebilirsiniz)
        uses: actions/upload-artifact@v4
        with:
          name: web-derleme
          path: build/web
          retention-days: 14

      # İsteğe bağlı: Netlify anahtarları tanımlıysa ve ana dalda ise otomatik yayınlar.
      - name: Netlify'a yayınla
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx --yes netlify-cli@17 deploy --dir=build/web --prod
