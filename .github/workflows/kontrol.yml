name: Kontrol ve derleme

# Her gönderimde kodu derler ve hata arar. Kırmızı çıkarsa Actions sekmesinden günlüğü açıp bana gönderin.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Supabase ayar dosyası
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          url=$(printf '%s' "$SB_URL" | tr -d '[:space:]"'"'")
          key=$(printf '%s' "$SB_KEY" | tr -d '[:space:]"'"'")
          printf "const supabaseUrl = '%s';\nconst supabaseAnonKey = '%s';\n" "$url" "$key" > lib/ayarlar.dart
          echo "URL uzunluğu: ${#url}, anahtar uzunluğu: ${#key}"

      - name: Paketler
        run: flutter pub get

      - name: Hata taraması (yalnızca hatalar başarısızlık sayılır)
        run: |
          set +e
          flutter analyze lib --no-fatal-infos --no-fatal-warnings > analiz.txt 2>&1
          kod=$?
          cat analiz.txt
          {
            echo '### Hata taraması'
            echo "Sonuç kodu: $kod"
            echo '#### Hatalar'
            echo '```'
            grep -E '^ *error' analiz.txt | head -200
            echo '```'
            echo '#### Uyarılar'
            echo '```'
            grep -E '^ *warning' analiz.txt | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $kod

      - name: Web derlemesi
        run: flutter build web --release

      - name: Derlemeyi sakla (indirip Netlify'a elle yükleyebilirsiniz)
        uses: actions/upload-artifact@v4
        with:
          name: web-derleme
          path: build/web
          retention-days: 14

      # İsteğe bağlı: Netlify anahtarları tanımlıysa ve ana dalda ise otomatik yayınlar.
      - name: Netlify'a yayınla
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx --yes netlify-cli@17 deploy --dir=build/web --prod
